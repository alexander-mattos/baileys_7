# Define rate-limiting zone in http context (this file is included in http via sites-enabled)
# keep the zone declaration outside server blocks to avoid "zero size shared memory zone" errors
limit_req_zone $binary_remote_addr zone=baileys_zone:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name baileys.conversaexpress.com.br;

    root /var/www/certbot;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baileys.conversaexpress.com.br;

    ssl_certificate /etc/letsencrypt/live/baileys.conversaexpress.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baileys.conversaexpress.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;


    access_log /var/log/nginx/baileys.access.log;
    error_log /var/log/nginx/baileys.error.log;

    location / {
        limit_req zone=baileys_zone burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:3333;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    if ($request_method !~ ^(GET|POST|HEAD)$ ) {
        return 405;
    }
}
